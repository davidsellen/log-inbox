<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log Inbox</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    :root {
      color-scheme: light;
      --canvas: #f4f6f5;
      --surface: #ffffff;
      --ink: #17201c;
      --muted: #607068;
      --line: #d8dfdb;
      --accent: #147a51;
      --accent-hover: #0f6240;
      --active: #e7f1ec;
      --pending: #9a6500;
      --danger: #a93434;
      --code: #eef1ef;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); }
    button, input, select, textarea { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    .topbar { background: #17201c; color: #fff; border-bottom: 1px solid #0d120f; }
    .topbar-inner { max-width: 1180px; margin: 0 auto; min-height: 58px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { font-size: 18px; font-weight: 700; }
    .health { display: flex; align-items: center; gap: 8px; color: #cbd5d0; font-size: 13px; }
    .health-dot { width: 9px; height: 9px; border-radius: 50%; background: #60c991; }
    .shell { max-width: 1180px; margin: 0 auto; padding: 26px 24px 48px; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
    .tab { border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--muted); padding: 10px 14px 9px; font-weight: 650; }
    .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
    .panel { display: none; padding-top: 24px; }
    .panel.active { display: block; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: 24px; margin-bottom: 4px; }
    h2 { font-size: 18px; margin-bottom: 4px; }
    .count, .subtle { color: var(--muted); font-size: 13px; }
    .button { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); min-height: 36px; padding: 7px 12px; font-weight: 650; }
    .button:hover { border-color: #aab7b0; background: #f9faf9; }
    .button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .button.primary:hover { background: var(--accent-hover); }
    .button.danger { color: var(--danger); }
    .button:disabled { cursor: wait; opacity: .6; }
    .queue-actions, .proposal-actions { display: flex; align-items: center; gap: 8px; }
    .queue-actions input { width: 145px; }
    .queue { border-top: 1px solid var(--line); }
    .proposal { border-bottom: 1px solid var(--line); padding: 18px 0; }
    .proposal-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }
    .proposal-title { font-size: 16px; font-weight: 700; margin-bottom: 7px; overflow-wrap: anywhere; }
    .meta { display: flex; flex-wrap: wrap; gap: 7px 14px; color: var(--muted); font-size: 12px; }
    .badge { color: var(--pending); font-weight: 700; text-transform: uppercase; }
    .links { margin: 12px 0 0; color: var(--accent); font-size: 13px; }
    details { margin-top: 14px; }
    summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 650; }
    pre { margin: 12px 0 0; padding: 14px; background: var(--code); border: 1px solid var(--line); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .empty { padding: 48px 0; text-align: center; color: var(--muted); border-bottom: 1px solid var(--line); }
    .settings { display: grid; grid-template-columns: minmax(280px, 390px) minmax(0, 1fr); gap: 32px; align-items: start; }
    form { display: grid; gap: 15px; }
    label { display: grid; gap: 6px; color: #34423b; font-size: 13px; font-weight: 650; }
    input, select, textarea { width: 100%; border: 1px solid #bfc9c3; border-radius: 5px; background: var(--surface); color: var(--ink); padding: 9px 10px; }
    input:focus, select:focus, textarea:focus { outline: 2px solid #9bcdb5; outline-offset: 1px; border-color: var(--accent); }
    textarea { min-height: 110px; resize: vertical; }
    .form-actions, .instruction-actions { display: flex; align-items: center; gap: 10px; }
    .status { min-height: 20px; color: var(--accent); font-size: 13px; }
    .status.error { color: var(--danger); }
    .instructions { min-width: 0; }
    .instructions pre { max-height: 620px; overflow: auto; background: #202723; color: #edf3ef; border-color: #202723; }
    .linking-layout { display: grid; grid-template-columns: minmax(230px, 300px) minmax(0, 1fr); gap: 28px; align-items: start; }
    .catalog { border-top: 1px solid var(--line); max-height: 680px; overflow: auto; }
    .catalog-group { padding: 14px 0 7px; font-size: 12px; font-weight: 750; color: var(--muted); text-transform: uppercase; }
    .catalog-note { padding: 6px 0; font-size: 13px; overflow-wrap: anywhere; }
    .catalog-note small { display: block; color: var(--muted); margin-top: 2px; }
    .rule-form { display: grid; grid-template-columns: 120px 100px minmax(130px, 1fr) minmax(180px, 1.3fr) auto; gap: 8px; align-items: end; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .condition-row { grid-column: 1 / -1; display: grid; grid-template-columns: 120px 100px minmax(130px, 1fr) auto; gap: 8px; align-items: end; }
    .mapping-list { border-top: 1px solid var(--line); margin-top: 12px; }
    .mapping-row { display: grid; grid-template-columns: 85px minmax(130px, .8fr) minmax(180px, 1fr) 190px auto; gap: 10px; align-items: center; min-height: 58px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .mapping-value { font-weight: 700; overflow-wrap: anywhere; }
    .mapping-sample { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .pill { display: inline-block; color: var(--muted); font-size: 11px; text-transform: uppercase; font-weight: 750; }
    .pill.resolved { color: var(--accent); }
    .pill.ambiguous { color: var(--danger); }
    .saved-rules { margin: 22px 0; }
    .saved-rule { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .saved-rule code { overflow-wrap: anywhere; }
    .inline-actions { display: flex; gap: 7px; flex-shrink: 0; }
    dialog { width: min(760px, calc(100% - 32px)); max-height: calc(100vh - 48px); border: 1px solid var(--line); border-radius: 7px; padding: 0; color: var(--ink); background: var(--surface); }
    dialog::backdrop { background: rgba(15, 24, 19, .46); }
    .dialog-body { padding: 22px; }
    .dialog-head, .dialog-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .dialog-head { margin-bottom: 14px; }
    .dialog-head h2 { margin: 0; }
    .dialog-actions { justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
    .dialog-body pre { max-height: 55vh; overflow: auto; }
    @media (max-width: 760px) {
      .topbar-inner, .shell { padding-left: 16px; padding-right: 16px; }
      .shell { padding-top: 18px; }
      .settings { grid-template-columns: 1fr; }
      .linking-layout { grid-template-columns: 1fr; }
      .rule-form, .mapping-row { grid-template-columns: 1fr; }
      .condition-row { grid-template-columns: 1fr; }
      .proposal-head { grid-template-columns: 1fr; }
      .proposal-head .button { justify-self: start; }
      .section-head { align-items: flex-start; }
      .queue-actions { align-items: flex-end; flex-wrap: wrap; justify-content: flex-end; }
      .proposal-actions { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">Log Inbox</div>
      <div class="health"><span class="health-dot"></span><span id="health-text">Connected</span></div>
    </div>
  </header>
  <main class="shell">
    <nav class="tabs" aria-label="Dashboard views">
      <button class="tab" data-tab="queue" aria-selected="true">Queue</button>
      <button class="tab" data-tab="linking" aria-selected="false">Linking</button>
      <button class="tab" data-tab="setup" aria-selected="false">Agent setup</button>
    </nav>

    <section id="queue-panel" class="panel active">
      <div class="section-head">
        <div><h1>Pending proposals</h1><div id="queue-count" class="count"></div></div>
        <div class="queue-actions">
          <span id="consolidate-status" class="status"></span>
          <input id="consolidate-date" type="date" aria-label="Day to consolidate">
          <button id="consolidate" class="button primary" type="button">Consolidate day</button>
          <button id="cancel-consolidation" class="button danger" type="button" hidden>Cancel</button>
          <button id="preview-result" class="button" type="button" hidden>Preview result</button>
          <button id="refresh" class="button" type="button">Refresh</button>
        </div>
      </div>
      <div id="queue" class="queue" aria-live="polite"></div>
    </section>

    <section id="linking-panel" class="panel">
      <div class="section-head">
        <div><h1>Vault linking</h1><div id="linking-count" class="count"></div></div>
        <div class="queue-actions"><span id="linking-status" class="status"></span><button id="scan-vault" class="button" type="button">Scan vault</button></div>
      </div>
      <div class="linking-layout">
        <aside>
          <h2>Note catalog</h2>
          <div id="catalog-meta" class="subtle"></div>
          <div id="catalog" class="catalog"></div>
        </aside>
        <div>
          <h2>Mapping rules</h2>
          <form id="rule-form" class="rule-form">
            <label>Field<select id="rule-field"></select></label>
            <label>Match<select id="rule-operator"><option value="exact">Exact</option><option value="prefix">Prefix</option></select></label>
            <label>Value<input id="rule-value" required></label>
            <label>Target note<select id="rule-target" required></select></label>
            <button class="button primary" type="submit">Save</button>
            <div id="condition-row" class="condition-row" hidden>
              <label>Condition field<select id="condition-field"></select></label>
              <label>Match<select id="condition-operator"><option value="exact">Exact</option><option value="prefix">Prefix</option></select></label>
              <label>Value<input id="condition-value"></label>
              <button id="remove-condition" class="button" type="button">Remove condition</button>
            </div>
            <button id="add-condition" class="button" type="button">Add condition</button>
          </form>
          <div id="saved-rules" class="saved-rules"></div>
          <div class="section-head"><div><h2>Observed identifiers</h2><div class="subtle">All retained events</div></div><select id="mapping-filter" aria-label="Filter identifiers"><option value="all">All</option><option value="unresolved">Unresolved</option><option value="suggested">Suggested</option><option value="resolved">Resolved</option><option value="ambiguous">Ambiguous</option></select></div>
          <div id="mapping-list" class="mapping-list" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <section id="setup-panel" class="panel">
      <div class="section-head"><div><h1>Agent setup</h1><div class="subtle">Saved locally in SQLite</div></div></div>
      <div class="settings">
        <form id="preferences-form">
          <label>Ingest URL<input id="ingest-url" name="ingest_url" type="url" required></label>
          <label>Agent name<input id="agent-name" name="agent_name" required></label>
          <label>Source prefix<input id="source-prefix" name="source_prefix" required></label>
          <label>Default host<input id="default-host" name="default_host"></label>
          <label>Additional instructions<textarea id="extra-instructions" name="extra_instructions"></textarea></label>
          <label>Daily consolidation prompt<textarea id="daily-consolidation-prompt" name="daily_consolidation_prompt"></textarea></label>
          <div class="form-actions"><button class="button primary" type="submit">Save preferences</button><span id="save-status" class="status"></span></div>
        </form>
        <div class="instructions">
          <div class="section-head"><div><h2>AGENTS.md</h2><div class="subtle">Windows-ready instructions</div></div><button id="copy" class="button" type="button">Copy</button></div>
          <pre id="instructions"></pre>
          <div id="copy-status" class="status"></div>
        </div>
      </div>
    </section>
  </main>

  <dialog id="preview-dialog">
    <div class="dialog-body">
      <div class="dialog-head"><div><h2>Daily consolidation preview</h2><div id="preview-meta" class="subtle"></div></div><button id="preview-close" class="button" type="button">Close</button></div>
      <pre id="preview-markdown"></pre>
      <div class="dialog-actions">
        <button id="preview-discard" class="button danger" type="button">Discard</button>
        <button id="preview-keep" class="button" type="button">Keep in queue</button>
        <button id="preview-apply" class="button primary" type="button">Apply to daily note</button>
      </div>
    </div>
  </dialog>

  <script>
    const state = { instructions: "", preview: null, proposals: [], consolidations: [], linking: null, awaitingJobId: null, pollTimer: null, preferencesLoaded: false };
    const queue = document.querySelector("#queue");
    const count = document.querySelector("#queue-count");
    const healthText = document.querySelector("#health-text");

    document.querySelectorAll(".tab").forEach((tab) => tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((item) => item.setAttribute("aria-selected", String(item === tab)));
      document.querySelectorAll(".panel").forEach((panel) => panel.classList.toggle("active", panel.id === `${tab.dataset.tab}-panel`));
      if (tab.dataset.tab === "linking") loadLinking();
    }));

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function renderProposals(proposals) {
      queue.replaceChildren();
      count.textContent = `${proposals.length} awaiting review`;
      if (!proposals.length) {
        queue.append(element("div", "empty", "No pending proposals"));
        return;
      }
      proposals.forEach((proposal) => {
        const row = element("article", "proposal");
        const head = element("div", "proposal-head");
        const identity = element("div");
        const summary = proposal.markdown
          .split("\n")
          .map((line) => line.trim())
          .find(Boolean)
          ?.replace(/^[-#*>\s]+/, "") || proposal.target_note;
        identity.append(element("div", "proposal-title", summary));
        const meta = element("div", "meta");
        meta.append(element("span", "badge", proposal.confidence || "unknown"));
        meta.append(element("span", "", proposal.target_note));
        meta.append(element("span", "", new Date(proposal.created_at).toLocaleString()));
        meta.append(element("span", "", `${proposal.evidence_event_ids.length} evidence event${proposal.evidence_event_ids.length === 1 ? "" : "s"}`));
        meta.append(element("span", "", proposal.provider));
        if (proposal.stale) meta.append(element("span", "badge", "links changed"));
        identity.append(meta);
        if (proposal.canonical_links.length) identity.append(element("div", "links", proposal.canonical_links.join("  ")));
        const actions = element("div", "proposal-actions");
        if (proposal.stale && proposal.consolidation_job_id) {
          const regenerate = element("button", "button", "Regenerate");
          regenerate.type = "button";
          regenerate.addEventListener("click", () => regenerateProposal(proposal, regenerate));
          actions.append(regenerate);
        }
        const discard = element("button", "button danger", "Discard");
        discard.type = "button";
        discard.addEventListener("click", () => discardProposal(proposal, discard));
        const apply = element("button", "button primary", "Apply");
        apply.type = "button";
        apply.addEventListener("click", () => applyProposal(proposal, apply));
        actions.append(discard, apply);
        head.append(identity, actions);
        const details = document.createElement("details");
        details.append(element("summary", "", "Read proposal"));
        details.append(element("pre", "", proposal.markdown));
        row.append(head, details);
        queue.append(row);
      });
    }

    function fillPreferences(preferences, instructions) {
      document.querySelector("#ingest-url").value = preferences.ingest_url;
      document.querySelector("#agent-name").value = preferences.agent_name;
      document.querySelector("#source-prefix").value = preferences.source_prefix;
      document.querySelector("#default-host").value = preferences.default_host;
      document.querySelector("#extra-instructions").value = preferences.extra_instructions;
      document.querySelector("#daily-consolidation-prompt").value = preferences.daily_consolidation_prompt;
      state.instructions = instructions;
      state.preferencesLoaded = true;
      document.querySelector("#instructions").textContent = instructions;
    }

    const selectorFields = ["source", "repo", "project", "product", "app", "service", "module", "work_item", "branch"];

    function fillFieldSelect(select) {
      select.replaceChildren(...selectorFields.map((field) => {
        const option = element("option", "", field.replace("_", " "));
        option.value = field;
        return option;
      }));
    }

    function noteOptions(selected = "") {
      return (state.linking?.catalog.notes || []).map((note) => {
        const option = element("option", "", `${note.title} — ${note.path}`);
        option.value = note.id;
        option.selected = note.id === selected;
        return option;
      });
    }

    function renderCatalog(catalog) {
      const root = document.querySelector("#catalog");
      root.replaceChildren();
      document.querySelector("#catalog-meta").textContent = catalog.configured ? `${catalog.notes.length} notes · revision ${catalog.revision}` : "Configure a vault directory to discover notes";
      const groups = new Map();
      catalog.notes.forEach((note) => {
        const group = note.group || "Other";
        if (!groups.has(group)) groups.set(group, []);
        groups.get(group).push(note);
      });
      for (const [group, notes] of groups) {
        root.append(element("div", "catalog-group", group));
        notes.forEach((note) => {
          const row = element("div", "catalog-note", note.title);
          row.append(element("small", "", [note.path, note.aliases.length ? `Aliases: ${note.aliases.join(", ")}` : ""].filter(Boolean).join(" · ")));
          root.append(row);
        });
      }
    }

    function ruleLabel(rule) {
      return rule.selectors.map((selector) => `${selector.field} ${selector.operator} "${selector.value}"`).join(" + ");
    }

    function renderRules(rules) {
      const root = document.querySelector("#saved-rules");
      root.replaceChildren();
      if (!rules.length) return;
      root.append(element("h3", "", "Saved rules"));
      rules.forEach((rule) => {
        const row = element("div", "saved-rule");
        const target = state.linking.catalog.notes.find((note) => note.id === rule.target_note_id)?.wikilink || rule.target_note_id;
        const label = element("code", "", `${ruleLabel(rule)} → ${target}`);
        const actions = element("div", "inline-actions");
        const toggle = element("button", "button", rule.enabled ? "Disable" : "Enable");
        toggle.type = "button";
        toggle.addEventListener("click", () => updateRule(rule, { ...rule, enabled: !rule.enabled }, toggle));
        const remove = element("button", "button danger", "Delete");
        remove.type = "button";
        remove.addEventListener("click", () => deleteRule(rule, remove));
        actions.append(toggle, remove);
        row.append(label, actions);
        root.append(row);
      });
    }

    function renderObserved() {
      const root = document.querySelector("#mapping-list");
      root.replaceChildren();
      const filter = document.querySelector("#mapping-filter").value;
      const rows = (state.linking?.observed || []).filter((item) => filter === "all" || item.status === filter);
      if (!rows.length) { root.append(element("div", "empty", "No identifiers in this view")); return; }
      rows.forEach((item) => {
        const row = element("div", "mapping-row");
        row.append(element("span", `pill ${item.status}`, `${item.field} · ${item.event_count}`));
        row.append(element("div", "mapping-value", item.value));
        row.append(element("div", "mapping-sample", item.resolved_notes.join(", ") || item.sample_message));
        const select = document.createElement("select");
        select.setAttribute("aria-label", `Target note for ${item.value}`);
        select.append(element("option", "", "Select note"), ...noteOptions(item.suggestions[0]?.note_id));
        const save = element("button", "button primary", "Map");
        save.type = "button";
        save.disabled = !state.linking.catalog.notes.length;
        save.addEventListener("click", async () => {
          if (!select.value) return;
          await createRule({ selectors: [{ field: item.field, operator: "exact", value: item.value }], target_note_id: select.value, enabled: true }, save);
        });
        row.append(select, save);
        root.append(row);
      });
    }

    async function loadLinking(useScan = false) {
      const status = document.querySelector("#linking-status");
      status.textContent = "Loading";
      try {
        const response = await fetch(useScan ? "/api/linking/scan" : "/api/linking", { method: useScan ? "POST" : "GET" });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Linking request failed");
        state.linking = data;
        document.querySelector("#linking-count").textContent = `${data.event_count} events · ${data.observed.filter((item) => item.status === "unresolved").length} unresolved identifiers`;
        document.querySelector("#rule-target").replaceChildren(...noteOptions());
        renderCatalog(data.catalog);
        renderRules(data.rules);
        renderObserved();
        status.textContent = "Current";
      } catch (error) {
        status.className = "status error";
        status.textContent = error.message;
      }
    }

    async function createRule(rule, button) {
      button.disabled = true;
      try {
        const response = await fetch("/api/linking/rules", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(rule) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Mapping save failed");
        await loadLinking();
      } catch (error) { document.querySelector("#linking-status").textContent = error.message; }
      finally { button.disabled = false; }
    }

    async function updateRule(rule, updated, button) {
      button.disabled = true;
      const response = await fetch(`/api/linking/rules/${encodeURIComponent(rule.id)}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(updated) });
      if (!response.ok) document.querySelector("#linking-status").textContent = (await response.json()).error || "Mapping update failed";
      await loadLinking();
    }

    async function deleteRule(rule, button) {
      if (!confirm(`Delete mapping ${ruleLabel(rule)}?`)) return;
      button.disabled = true;
      const response = await fetch(`/api/linking/rules/${encodeURIComponent(rule.id)}`, { method: "DELETE" });
      if (!response.ok) document.querySelector("#linking-status").textContent = (await response.json()).error || "Mapping delete failed";
      await loadLinking();
    }

    function selectedDay() {
      const parts = document.querySelector("#consolidate-date").value.split("-").map(Number);
      const start = new Date(parts[0], parts[1] - 1, parts[2]);
      const end = new Date(parts[0], parts[1] - 1, parts[2] + 1);
      const label = new Intl.DateTimeFormat("en", { month: "short", day: "numeric" }).format(start);
      return { start, end, targetNote: `Daily log ${label}` };
    }

    function renderConsolidationState() {
      clearTimeout(state.pollTimer);
      const selected = selectedDay();
      const job = state.consolidations.find((item) =>
        item.target_note === selected.targetNote && new Date(item.start).getTime() === selected.start.getTime()
      );
      const proposal = job?.proposal_id ? state.proposals.find((item) => item.proposal_id === job.proposal_id) : null;
      const active = job && ["pending", "running", "cancel_requested"].includes(job.status);
      const status = document.querySelector("#consolidate-status");
      const consolidate = document.querySelector("#consolidate");
      const cancel = document.querySelector("#cancel-consolidation");
      const preview = document.querySelector("#preview-result");
      consolidate.disabled = Boolean(active);
      consolidate.textContent = active ? "Consolidating" : "Consolidate day";
      cancel.hidden = !active;
      cancel.dataset.jobId = active ? job.id : "";
      preview.hidden = !proposal;
      preview.onclick = proposal ? () => openPreview(proposal) : null;
      status.className = job?.status === "failed" ? "status error" : "status";
      status.textContent = !job ? "" : ({
        pending: `${job.event_count} events queued`,
        running: `LLM processing ${job.event_count} events`,
        cancel_requested: "Cancelling",
        cancelled: "Cancelled",
        failed: job.error || "Consolidation failed",
        completed: proposal ? `${job.event_count} events ready` : "Result handled"
      }[job.status] || job.status);
      if (state.awaitingJobId === job?.id && proposal) {
        state.awaitingJobId = null;
        openPreview(proposal);
      }
      if (active) state.pollTimer = setTimeout(load, 1200);
    }

    async function load() {
      try {
        const response = await fetch("/api/dashboard");
        if (!response.ok) throw new Error((await response.json()).error || "Dashboard request failed");
        const data = await response.json();
        state.proposals = data.proposals;
        state.consolidations = data.consolidations || [];
        renderProposals(data.proposals);
        if (!state.preferencesLoaded) fillPreferences(data.preferences, data.instructions);
        renderConsolidationState();
        healthText.textContent = "Connected";
      } catch (error) {
        healthText.textContent = "Unavailable";
        queue.replaceChildren(element("div", "empty", error.message));
      }
    }

    async function applyProposal(proposal, button) {
      if (!confirm(`Apply ${proposal.proposal_id} to ${proposal.target_note}?`)) return;
      const original = button.textContent;
      button.disabled = true;
      button.textContent = "Applying";
      try {
        const response = await fetch(`/api/proposals/${encodeURIComponent(proposal.proposal_id)}/apply`, { method: "POST" });
        if (!response.ok) throw new Error((await response.json()).error || "Apply failed");
        await load();
        return true;
      } catch (error) {
        alert(error.message);
        button.disabled = false;
        button.textContent = original;
        return false;
      }
    }

    async function regenerateProposal(proposal, button) {
      button.disabled = true;
      button.textContent = "Queuing";
      try {
        const response = await fetch(`/api/proposals/${encodeURIComponent(proposal.proposal_id)}/regenerate`, { method: "POST" });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Regeneration failed");
        state.awaitingJobId = data.id;
        await load();
      } catch (error) {
        button.disabled = false;
        button.textContent = "Regenerate";
        alert(error.message);
      }
    }

    async function discardProposal(proposal, button, confirmDiscard = true) {
      if (confirmDiscard && !confirm(`Discard ${proposal.proposal_id}? Its original events remain in SQLite.`)) return false;
      button.disabled = true;
      const original = button.textContent;
      button.textContent = "Discarding";
      try {
        const response = await fetch(`/api/proposals/${encodeURIComponent(proposal.proposal_id)}/discard`, { method: "POST" });
        if (!response.ok) throw new Error((await response.json()).error || "Discard failed");
        await load();
        return true;
      } catch (error) {
        alert(error.message);
        button.disabled = false;
        button.textContent = original;
        return false;
      }
    }

    function openPreview(proposal) {
      state.preview = proposal;
      document.querySelector("#preview-meta").textContent = `${proposal.target_note} · ${proposal.evidence_event_ids.length} evidence events · ${proposal.confidence} confidence`;
      document.querySelector("#preview-markdown").textContent = proposal.markdown;
      document.querySelector("#preview-dialog").showModal();
    }

    document.querySelector("#consolidate").addEventListener("click", async () => {
      const button = document.querySelector("#consolidate");
      const status = document.querySelector("#consolidate-status");
      const selected = selectedDay();
      button.disabled = true;
      button.textContent = "Queuing";
      status.className = "status";
      status.textContent = "Saving job";
      try {
        const response = await fetch("/api/consolidations/daily", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ start: selected.start.toISOString(), end: selected.end.toISOString(), target_note: selected.targetNote })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Consolidation failed");
        state.awaitingJobId = data.id;
        await load();
      } catch (error) {
        status.className = "status error";
        status.textContent = error.message;
        button.disabled = false;
        button.textContent = "Consolidate day";
      }
    });

    document.querySelector("#cancel-consolidation").addEventListener("click", async (event) => {
      const button = event.currentTarget;
      button.disabled = true;
      try {
        const response = await fetch(`/api/consolidations/${encodeURIComponent(button.dataset.jobId)}/cancel`, { method: "POST" });
        if (!response.ok) throw new Error((await response.json()).error || "Cancel failed");
        state.awaitingJobId = null;
        await load();
      } catch (error) {
        const status = document.querySelector("#consolidate-status");
        status.className = "status error";
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    document.querySelector("#preview-close").addEventListener("click", () => document.querySelector("#preview-dialog").close());
    document.querySelector("#preview-keep").addEventListener("click", () => document.querySelector("#preview-dialog").close());
    document.querySelector("#preview-apply").addEventListener("click", async (event) => {
      if (state.preview && await applyProposal(state.preview, event.currentTarget)) document.querySelector("#preview-dialog").close();
    });
    document.querySelector("#preview-discard").addEventListener("click", async (event) => {
      if (state.preview && await discardProposal(state.preview, event.currentTarget, false)) document.querySelector("#preview-dialog").close();
    });

    document.querySelector("#preferences-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const status = document.querySelector("#save-status");
      status.className = "status";
      status.textContent = "Saving";
      const preferences = {
        ingest_url: document.querySelector("#ingest-url").value.trim(),
        agent_name: document.querySelector("#agent-name").value.trim(),
        source_prefix: document.querySelector("#source-prefix").value.trim(),
        default_host: document.querySelector("#default-host").value.trim(),
        extra_instructions: document.querySelector("#extra-instructions").value.trim(),
        daily_consolidation_prompt: document.querySelector("#daily-consolidation-prompt").value.trim()
      };
      try {
        const response = await fetch("/api/preferences", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(preferences) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Save failed");
        fillPreferences(data.preferences, data.instructions);
        status.textContent = "Saved";
      } catch (error) {
        status.className = "status error";
        status.textContent = error.message;
      }
    });

    document.querySelector("#copy").addEventListener("click", async () => {
      const status = document.querySelector("#copy-status");
      try {
        await navigator.clipboard.writeText(state.instructions);
        status.className = "status";
        status.textContent = "Copied";
      } catch (error) {
        status.className = "status error";
        status.textContent = "Clipboard access failed";
      }
    });

    fillFieldSelect(document.querySelector("#rule-field"));
    fillFieldSelect(document.querySelector("#condition-field"));
    document.querySelector("#scan-vault").addEventListener("click", () => loadLinking(true));
    document.querySelector("#mapping-filter").addEventListener("change", renderObserved);
    document.querySelector("#add-condition").addEventListener("click", () => {
      document.querySelector("#condition-row").hidden = false;
      document.querySelector("#add-condition").hidden = true;
    });
    document.querySelector("#remove-condition").addEventListener("click", () => {
      document.querySelector("#condition-row").hidden = true;
      document.querySelector("#condition-value").value = "";
      document.querySelector("#add-condition").hidden = false;
    });
    document.querySelector("#rule-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const selectors = [{ field: document.querySelector("#rule-field").value, operator: document.querySelector("#rule-operator").value, value: document.querySelector("#rule-value").value.trim() }];
      const conditionValue = document.querySelector("#condition-value").value.trim();
      if (!document.querySelector("#condition-row").hidden && conditionValue) selectors.push({ field: document.querySelector("#condition-field").value, operator: document.querySelector("#condition-operator").value, value: conditionValue });
      await createRule({ selectors, target_note_id: document.querySelector("#rule-target").value, enabled: true }, event.submitter);
      event.currentTarget.reset();
    });
    document.querySelector("#refresh").addEventListener("click", load);
    document.querySelector("#consolidate-date").valueAsDate = new Date();
    document.querySelector("#consolidate-date").addEventListener("change", renderConsolidationState);
    if (location.hash === "#linking") document.querySelector('[data-tab="linking"]').click();
    load();
  </script>
</body>
</html>
