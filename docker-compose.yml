services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${LOG_INBOX_LLM_MODEL:-granite3.3:2b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  collector:
    image: log-inbox:local
    build:
      context: .
      dockerfile: docker/collector.Dockerfile
      args:
        APP_UID: "${LOG_INBOX_HOST_UID:-1000}"
        APP_GID: "${LOG_INBOX_HOST_GID:-1000}"
    env_file:
      - path: .env
        required: false
    ports:
      - "${LOG_INBOX_BIND:-127.0.0.1}:${LOG_INBOX_HTTP_PORT:-8787}:8787"
    volumes:
      - log-inbox-data:/data
    restart: unless-stopped

  mcp:
    image: log-inbox-mcp:local
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
      args:
        APP_UID: "${LOG_INBOX_HOST_UID:-1000}"
        APP_GID: "${LOG_INBOX_HOST_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      LOG_INBOX_LLM_BASE_URL: "${LOG_INBOX_LLM_BASE_URL:-http://ollama:11434/v1}"
      LOG_INBOX_LLM_MODEL: "${LOG_INBOX_LLM_MODEL:-granite3.3:2b}"
      LOG_INBOX_PROPOSAL_DIR: "${LOG_INBOX_PROPOSAL_DIR:-/vault-inbox}"
      LOG_INBOX_DAILY_NOTES_DIR: "${LOG_INBOX_DAILY_NOTES_DIR:-/vault-daily}"
      LOG_INBOX_VAULT_CONTEXT_FILE: "${LOG_INBOX_VAULT_CONTEXT_FILE:-/config/vault-context.json}"
      LOG_INBOX_PRODUCT_INDEX_FILE: "${LOG_INBOX_PRODUCT_INDEX_FILE:-/config/product-navigation.md}"
      LOG_INBOX_AUTO_STAGE_INTERVAL_SECONDS: "${LOG_INBOX_AUTO_STAGE_INTERVAL_SECONDS:-30}"
      LOG_INBOX_AUTO_STAGE_QUIET_SECONDS: "${LOG_INBOX_AUTO_STAGE_QUIET_SECONDS:-30}"
      LOG_INBOX_AUTO_STAGE_BATCH_SIZE: "${LOG_INBOX_AUTO_STAGE_BATCH_SIZE:-100}"
    ports:
      - "${LOG_INBOX_BIND:-127.0.0.1}:${LOG_INBOX_MCP_PORT:-8788}:8788"
    volumes:
      - log-inbox-data:/data
      - "${LOG_INBOX_PROPOSAL_HOST_DIR:-./data/vault-inbox}:${LOG_INBOX_PROPOSAL_DIR:-/vault-inbox}"
      - "${LOG_INBOX_DAILY_NOTES_HOST_DIR:-./data/daily-notes}:${LOG_INBOX_DAILY_NOTES_DIR:-/vault-daily}"
      - "${LOG_INBOX_VAULT_CONTEXT_HOST_FILE:-./config/vault-context.json}:${LOG_INBOX_VAULT_CONTEXT_FILE:-/config/vault-context.json}:ro"
      - "${LOG_INBOX_PRODUCT_INDEX_HOST_FILE:-./config/product-navigation.md}:${LOG_INBOX_PRODUCT_INDEX_FILE:-/config/product-navigation.md}:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    userns_mode: host
    depends_on:
      collector:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  log-inbox-data:
  ollama-data:
